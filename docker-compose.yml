services:
  backend:
    build: ./backend/simpleapi
    container_name: simple-api
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app-network
      - db-network
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    build: ./database
    container_name: database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  
  front:
    build: ./front
    container_name: front
    networks:
      - app-network
    restart: unless-stopped

  httpd:
    build: ./http-server
    container_name: httpd
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      FRONT_HOST: front
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend
      - front
    restart: unless-stopped

networks:
  app-network:
  db-network:

volumes:
  db-data: